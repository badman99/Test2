name: 🖥️ VNC + RustDesk Desktop

on:
  push:
  workflow_dispatch:

jobs:
  desktop-vnc:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install Display + VNC Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc fluxbox wmctrl libpulse0 libnss3 libglu1-mesa
          echo "✅ Packages installed!"

      - name: 🖥️ Display + Fluxbox + VNC + Bore Start
        run: |
          Xvfb :1 -screen 0 1920x1080x24 &
          export DISPLAY=:1
          sleep 2

          fluxbox &
          sleep 3
          echo "✅ Display + Fluxbox Ready!"

          x11vnc -display :1 -nopw -forever -shared -bg -o /tmp/x11vnc.log -xkb -capslock -skip_lockkeys
          sleep 2
          echo "✅ VNC Started!"

          curl -Ls https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar zx -C /usr/local/bin
          chmod +x /usr/local/bin/bore

          bore local 5900 --to bore.pub 2>&1 | tee /tmp/bore.log &
          sleep 5

          echo "============================================"
          echo "📱 PHONE PE YEH KARO:"
          echo "App  : RealVNC / MultiVNC"
          echo "Host : bore.pub"
          echo "Port : (neeche dekho)"
          cat /tmp/bore.log | grep "remote_port\|listening"
          echo "Pass : koi nahi - seedha connect!"
          echo "============================================"

      - name: 📱 RustDesk Install + Start
        env:
          DISPLAY: :1
        run: |
          wget -q \
            https://github.com/rustdesk/rustdesk/releases/download/1.4.6/rustdesk-1.4.6-x86_64.deb \
            -O rustdesk.deb
          sudo apt-get install -y -f ./rustdesk.deb
          echo "✅ RustDesk Installed!"

          nohup rustdesk > /dev/null 2>&1 &
          sleep 5
          echo "✅ RustDesk Desktop pe chal raha hai!"
          echo "VNC se connect karo aur RustDesk setup karo! 😎"

          sleep 21600

      - name: 🔐 SSH via tmate
        uses: mxschmitt/action-tmate@v3
        if: always()
