name: 🖥️ Mobile Remote Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🖥️ Desktop Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xvfb \
            x11vnc \
            curl wget

      - name: 🚀 Display + Desktop Start
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          startxfce4 &
          sleep 3

      - name: 📱 RustDesk Latest Install
        run: |
          LATEST_URL=$(curl -s \
            https://api.github.com/repos/rustdesk/rustdesk/releases/latest \
            | grep "browser_download_url" \
            | grep "x86_64.deb" \
            | cut -d '"' -f 4)
          
          echo "⬇️ Downloading: $LATEST_URL"
          wget -q "$LATEST_URL" -O rustdesk.deb
          sudo apt-get install -y -f ./rustdesk.deb
          echo "✅ RustDesk Ready!"

      - name: 🔑 Password + Start
        run: |
          export DISPLAY=:99
          rustdesk --password "mobile1234" &
          sleep 10
          
          RUST_ID=$(rustdesk --get-id)
          echo "━━━━━━━━━━━━━━━━━━━━━"
          echo "📱 Mobile App में डालो:"
          echo "🆔 ID    : $RUST_ID"
          echo "🔑 Pass  : mobile1234"
          echo "━━━━━━━━━━━━━━━━━━━━━"

      - name: ⏳ Alive Rakho
        run: sleep 21600
