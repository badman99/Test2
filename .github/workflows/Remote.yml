name: 🖥️ Mobile Remote Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 🖥️ Desktop Install
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xvfb \
            x11vnc

      - name: 🚀 Display + Desktop Start
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          startxfce4 &
          sleep 3

      - name: 📱 RustDesk Install
        run: |
          # Latest RustDesk download
          wget -q \
            https://github.com/rustdesk/rustdesk/releases/latest/download/rustdesk-1.3.8-x86_64.deb
          
          sudo apt-get install -y \
            ./rustdesk-*.deb
          
          echo "✅ RustDesk Installed!"

      - name: 🔑 RustDesk Password Set
        run: |
          # Password set karo
          rustdesk --password "mobile1234"
          
          sleep 2

      - name: 🚀 RustDesk Start + ID lo
        run: |
          export DISPLAY=:99
          
          # RustDesk start karo background mein
          rustdesk &
          
          sleep 10  # Startup ka wait
          
          # ID nikalo
          RUST_ID=$(rustdesk --get-id)
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📱 MOBILE PE YEH DAALO:"
          echo "🆔 ID       : $RUST_ID"
          echo "🔑 Password : mobile1234"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ⏳ Session Alive
        run: sleep 21600
