name: Selenium Stealth Bypass 🥷

on:
  workflow_dispatch: 

jobs:
  fast-bypass:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Lite Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb
          pip install selenium selenium-stealth

      - name: 🚀 Run Selenium Stealth (Inline)
        run: |
          cat <<EOF > stealth_script.py
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.chrome.options import Options
          from selenium_stealth import stealth

          print("🕵️ Initializing Lite Stealth Engine...")

          options = Options()
          options.add_argument("--headless") # GitHub पर headless fast चलता है
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_experimental_option("excludeSwitches", ["enable-automation"])
          options.add_experimental_option('useAutomationExtension', False)

          driver = webdriver.Chrome(options=options)

          # ✨ Stealth Magic: Ye properties ko hide kar dega
          stealth(driver,
              languages=["en-US", "en"],
              vendor="Google Inc.",
              platform="Win32",
              webgl_vendor="Intel Inc.",
              renderer="Intel Iris OpenGL Engine",
              fix_hairline=True,
          )

          try:
              url = "https://hubcloud.foo/drive/qoef8hunw1qfkuw"
              print(f"🔗 Opening: {url}")
              driver.get(url)

              print("⏳ Waiting 10 seconds (JS Rendering)...")
              time.sleep(10)

              # Check if we got the button
              page_source = driver.page_source
              if 'id="download"' in page_source:
                  print("🔥 Success! Download button found with Stealth.")
              else:
                  print("⚠️ Button not found. Cloudflare might have blocked us.")

              with open("stealth_result.html", "w", encoding="utf-8") as f:
                  f.write(page_source)
                  
              print("💾 Result saved to stealth_result.html")

          except Exception as e:
              print(f"❌ Error: {e}")

          finally:
              driver.quit()
          EOF

          # Run it
          python stealth_script.py

      - name: 📤 Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: stealth-html-source
          path: stealth_result.html
