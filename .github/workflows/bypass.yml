name: HubCloud Bypass Test 🕵️

on:
  workflow_dispatch: 

jobs:
  test-cloud-bypass:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Dependencies & Chrome
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb
          
          echo "Installing Python libraries..."
          pip install undetected-chromedriver selenium

      - name: 🚀 Run Python Script (Auto-Version Fix)
        run: |
          cat <<EOF > bypass_script.py
          import time
          import subprocess
          import undetected_chromedriver as uc

          def get_chrome_main_version():
              # Chrome का version चेक करने के लिए जुगाड़
              try:
                  res = subprocess.check_output(['google-chrome', '--version']).decode('utf-8')
                  version = res.split()[2].split('.')[0]
                  print(f"🔍 Installed Chrome Version: {version}")
                  return int(version)
              except Exception as e:
                  print(f"⚠️ Version check failed: {e}")
                  return None

          print("🚀 Launching Stealth Browser with Version Match...")

          options = uc.ChromeOptions()
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1920,1080')

          main_v = get_chrome_main_version()

          try:
              # version_main देना ज़रूरी है ताकि mismatch न हो
              driver = uc.Chrome(options=options, version_main=main_v)
              
              url = "https://hubcloud.foo/drive/qoef8hunw1qfkuw"
              print(f"🔗 Opening URL: {url}")
              
              driver.get(url)

              print("⏳ Waiting 12 seconds for everything to load...")
              time.sleep(12)

              page_source = driver.page_source
              page_title = driver.title
              
              print(f"✅ Page Title: {page_title}")
              
              with open("hubcloud_result.html", "w", encoding="utf-8") as f:
                  f.write(page_source)
                  
              print("💾 HTML Saved successfully!")

          except Exception as e:
              print(f"❌ Error aagaya: {e}")
              with open("hubcloud_result.html", "w", encoding="utf-8") as f:
                  f.write(f"<h1>Error Occurred</h1><p>{e}</p>")

          finally:
              try:
                  driver.quit()
              except:
                  pass
          EOF

          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python bypass_script.py

      - name: 📤 Upload HTML Result
        uses: actions/upload-artifact@v4
        with:
          name: hubcloud-html-source
          path: hubcloud_result.html
