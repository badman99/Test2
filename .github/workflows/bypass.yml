name: Super Light Stealth Snatcher 🥷

on:
  workflow_dispatch:

jobs:
  stealth-light-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Stealth Requests
        run: pip install curl_cffi

      - name: 🚀 Extract Link (Stealth Mode)
        run: |
          cat <<EOF > stealth_snatch.py
          from curl_cffi import requests
          import re

          url = "https://hubcloud.foo/drive/qoef8hunw1qfkuw"
          
          print("🕵️‍♂️ Browser की आवाज़ में रिक्वेस्ट भेज रहा हूँ...")
          
          # curl_cffi में impersonate="chrome" करने से ये बिल्कुल असली Chrome बन जाता है
          try:
              response = requests.get(url, impersonate="chrome", timeout=15)
              
              if response.status_code == 200:
                  print("✅ HTML मिल गया! अब लिंक ढूंढ रहा हूँ...")
                  
                  # वही पुराना जादुई Regex
                  match = re.search(r"var url = '(.*?)';", response.text)
                  
                  if match:
                      final_link = match.group(1)
                      print(f"\n🔥 JACPOT! लिंक मिल गया: {final_link}")
                      with open("final_link.txt", "w") as f:
                          f.write(final_link)
                  else:
                      print("❌ Script टैग में लिंक नहीं मिला।")
                      with open("source.html", "w", encoding='utf-8') as f:
                          f.write(response.text)
              else:
                  print(f"❌ अभी भी अटका दिया! Status: {response.status_code}")
                  with open("error.html", "w", encoding='utf-8') as f:
                      f.write(response.text)

          except Exception as e:
              print(f"💥 भारी एरर: {e}")
          EOF

          python stealth_snatch.py

      - name: 📤 Save Result
        uses: actions/upload-artifact@v4
        with:
          name: stealth-link-result
          path: |
            final_link.txt
            source.html
            error.html
