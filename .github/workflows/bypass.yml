name: Super Light Link Snatcher ☁️

on:
  workflow_dispatch:

jobs:
  ultra-light-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Requests
        run: pip install requests

      - name: 🚀 Extract Link (No Browser Mode)
        run: |
          cat <<EOF > light_snatch.py
          import requests
          import re
          import time

          url = "https://hubcloud.foo/drive/qoef8hunw1qfkuw"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          print("📡 Request bhej raha hoon...")
          response = requests.get(url, headers=headers)

          if response.status_code == 200:
              print("✅ HTML mil gaya!")
              
              # 🕵️‍♂️ Ab Magic Dekho: Script tag ke andar se link nikalte hain
              # Hum wo 'var url' wali line dhoond rahe hain
              match = re.search(r"var url = '(.*?)';", response.text)
              
              if match:
                  final_link = match.group(1)
                  print(f"\n🔥 JACPOT! Link mil gaya: {final_link}")
                  with open("final_link.txt", "w") as f:
                      f.write(final_link)
              else:
                  print("❌ Script me link nahi mila, shayad site badal gayi.")
                  # Debugging ke liye source save kar lo
                  with open("source.html", "w") as f:
                      f.write(response.text)
          else:
              print(f"❌ Site block kar rahi hai: {response.status_code}")
          EOF

          python light_snatch.py

      - name: 📤 Save Result
        uses: actions/upload-artifact@v4
        with:
          name: final-link-result
          path: |
            final_link.txt
            source.html
