name: Full Stealth Link Hunter 🥷💎

on:
  workflow_dispatch:

jobs:
  mega-extraction:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Stealth Requests
        run: pip install curl_cffi

      - name: 🚀 Start Surgical Strike
        run: |
          cat <<EOF > final_strike.py
          from curl_cffi import requests
          import re
          import json

          # --- CONFIG ---
          START_URL = "https://hubcloud.foo/drive/qoef8hunw1qfkuw"
          HEADERS = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}

          def scan_for_google(html):
              """Googleusercontent वाला जादुई लिंक ढूंढने के लिए"""
              match = re.search(r'https?://[^\s"\'<>]+googleusercontent[^\s"\'<>]+', html)
              return match.group(0) if match else None

          def main():
              print("🕵️‍♂️ Step 1: HubCloud से GamerXYT का टोकन निकाल रहा हूँ...")
              r1 = requests.get(START_URL, impersonate="chrome")
              gamer_match = re.search(r"var url = '(.*?)';", r1.text)
              
              if not gamer_match:
                  print("❌ GamerXYT लिंक नहीं मिला!")
                  return
              
              gamer_url = gamer_match.group(1)
              print(f"✅ GamerXYT लिंक मिला: {gamer_url}")

              print("\n🕵️‍♂️ Step 2: GamerXYT के पेट से HubCDN का लिंक निकाल रहा हूँ...")
              r2 = requests.get(gamer_url, impersonate="chrome")
              
              # HubCDN के लिए Regex
              hubcdn_match = re.search(r'https://pixel\.hubcdn\.fans/\?id=[^\s"\'<>]+', r2.text)
              
              if not hubcdn_match:
                  print("⚠️ HubCDN लिंक नहीं मिला, शायद सीधे Google वाला हो?")
                  google_link = scan_for_google(r2.text)
              else:
                  hubcdn_url = hubcdn_match.group(0)
                  print(f"✅ HubCDN लिंक मिला: {hubcdn_url}")
                  
                  print("\n🕵️‍♂️ Step 3: Redirects का पीछा कर रहा हूँ (HubCDN -> Final Page)...")
                  # allow_redirects=True ताकि हम आखिरी मंजिल तक पहुँच जाएँ
                  r3 = requests.get(hubcdn_url, impersonate="chrome", allow_redirects=True)
                  print(f"🏁 आखिरी मंज़िल का URL: {r3.url}")
                  
                  # यहाँ भी Google लिंक स्कैन करो
                  google_link = scan_for_google(r3.text)
                  
                  # अंतिम पेज का सोर्स सेव करो
                  with open("final_page_source.html", "w", encoding='utf-8') as f:
                      f.write(r3.text)
                  print("💾 अंतिम पेज का Source Code सेव हो गया!")

              if google_link:
                  print(f"\n🔥 जैकपॉट!!! Google Direct Link मिल गया: \n{google_link}")
                  with open("jackpot_link.txt", "w") as f:
                      f.write(google_link)
              else:
                  print("\n❌ अफ़सोस! Google लिंक हाथ नहीं आया।")

          if __name__ == "__main__":
              main()
          EOF

          python final_strike.py

      - name: 📤 Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: link-extraction-results
          path: |
            jackpot_link.txt
            final_page_source.html
