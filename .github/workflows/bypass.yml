name: HubCloud Bypass Test 🕵️

on:
  workflow_dispatch: # Manually run karne ke liye button

jobs:
  test-cloud-bypass:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Install Dependencies & Chrome
        run: |
          echo "Installing system dependencies..."
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb
          
          echo "Installing Python libraries..."
          pip install undetected-chromedriver selenium

      - name: 🚀 Run Python Script (Inline)
        run: |
          # Hamara Python Code yahi generate hoga
          cat <<EOF > bypass_script.py
          import time
          import undetected_chromedriver as uc
          from selenium.webdriver.common.by import By

          print("🚀 Setup complete. Launching Stealth Browser...")

          # Chrome Options setup
          options = uc.ChromeOptions()
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1920,1080')
          # Headless use nahi kar rahe, Xvfb use karenge taaki real user lage

          try:
              driver = uc.Chrome(options=options)
              
              url = "https://hubcloud.foo/drive/qoef8hunw1qfkuw"
              print(f"🔗 Opening URL: {url}")
              
              driver.get(url)

              print("⏳ Waiting 10 seconds for Cloudflare/JavaScript...")
              time.sleep(10)

              # HTML Source Code Nikalo
              page_source = driver.page_source
              page_title = driver.title
              
              print(f"✅ Page Title: {page_title}")
              
              # Result file me save karo
              with open("hubcloud_result.html", "w", encoding="utf-8") as f:
                  f.write(page_source)
                  
              print("💾 HTML Saved successfully!")

          except Exception as e:
              print(f"❌ Error aagaya: {e}")
              # Error aaye to bhi file banayenge taaki pata chale kya hua
              with open("hubcloud_result.html", "w", encoding="utf-8") as f:
                  f.write(f"<h1>Error Occurred</h1><p>{e}</p>")

          finally:
              try:
                  driver.quit()
              except:
                  pass
          EOF

          # Ab isko Fake Display (Xvfb) ke sath run karte hain
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python bypass_script.py

      - name: 📤 Upload HTML Result
        uses: actions/upload-artifact@v4
        with:
          name: hubcloud-html-source
          path: hubcloud_result.html
