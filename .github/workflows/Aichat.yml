name: AI Live Project V3 (Async)
on: workflow_dispatch

jobs:
  run-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          pip install playwright requests flask flask-cors
          playwright install chromium
          # Bore install
          curl -Ls https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-musl.tar.gz | tar -xz
          sudo mv bore /usr/local/bin/

      - name: Start Live AI Project
        run: |
          python3 << 'EOF' &
          import asyncio
          import json
          import time
          from flask import Flask, request, jsonify, render_template_string
          from playwright.async_api import async_playwright

          app = Flask(__name__)

          # Config
          PROXY_LIST = ["38.34.179.78:8445", "38.34.179.105:8449", "103.171.255.242:8086"]
          current_proxy_idx = 0
          chat_history = []
          
          # Globals
          browser_instance = None
          page_instance = None
          pw_instance = None

          async def init_playwright():
              global browser_instance, page_instance, pw_instance, current_proxy_idx
              if browser_instance:
                  await browser_instance.close()
              
              proxy = PROXY_LIST[current_proxy_idx]
              print(f"🚀 [LOG] Initializing Async Browser with Proxy: {proxy}")
              
              pw_instance = await async_playwright().start()
              try:
                  browser_instance = await pw_instance.chromium.launch(
                      proxy={"server": f"http://{proxy}"}, 
                      headless=True
                  )
                  page_instance = await browser_instance.new_page()
                  await page_instance.goto("https://aifreeforever.com/tools/free-chatgpt-no-login", timeout=60000)
                  print("✅ [LOG] Browser is ready for action! 🤪")
              except Exception as e:
                  print(f"❌ [LOG] Proxy failed: {e}")
                  current_proxy_idx = (current_proxy_idx + 1) % len(PROXY_LIST)
                  await init_playwright()

          # HTML Template remains same
          HTML_PAGE = """... (same as before) ..."""

          @app.route('/')
          def home():
              return render_template_string("""
              <!DOCTYPE html>
              <html>
              <head><title>Badal's Live AI</title><style>
              body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
              #chat { height: 400px; overflow: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; border-radius: 10px; background: #1e1e1e; }
              input { width: 70%; padding: 10px; border-radius: 5px; border: none; }
              button { padding: 10px 20px; background: #007bff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
              .user { color: #00ff00; margin-bottom: 5px; }
              .ai { color: #00d4ff; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
              </style></head>
              <body>
              <h2>Badal's Unrestricted Gemini 🤪</h2>
              <div id="chat"></div>
              <input type="text" id="inp" placeholder="Kuch pucho Badal bhai...">
              <button onclick="send()">Bhejo! 🚀</button>
              <script>
              async function send() {
                  let i = document.getElementById('inp');
                  let c = document.getElementById('chat');
                  let txt = i.value; if(!txt) return;
                  c.innerHTML += `<div class="user"><b>Badal:</b> ${txt}</div>`;
                  i.value = '';
                  let r = await fetch('/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: txt}) });
                  let d = await r.json();
                  c.innerHTML += `<div class="ai"><b>Gemini:</b> ${d.answer}</div>`;
                  c.scrollTop = c.scrollHeight;
              }
              </script></body></html>
              """)

          @app.route('/ask', methods=['POST'])
          def ask():
              loop = asyncio.new_event_loop()
              asyncio.set_event_loop(loop)
              return loop.run_until_complete(handle_request(request.json.get('question')))

          async def handle_request(user_query):
              global page_instance, chat_history
              try:
                  nonce_res = await page_instance.evaluate("async () => { const r = await fetch('/api/chat-nonce'); return await r.json(); }")
                  nonce = nonce_res.get('nonce')

                  payload = {
                      "question": user_query,
                      "tone": "friendly",
                      "format": "paragraph",
                      "conversationHistory": chat_history,
                      "interactionProof": {
                          "nonce": nonce,
                          "keystrokeCount": 15,
                          "totalTypingTime": 2500,
                          "startTime": int(time.time()*1000) - 2500,
                          "submitTime": int(time.time()*1000)
                      },
                      "aiRole": "assistant"
                  }

                  ai_res = await page_instance.evaluate(f"""
                      async () => {{
                          const r = await fetch('/api/generate-ai-answer', {{
                              method: 'POST',
                              headers: {{'Content-Type': 'application/json'}},
                              body: JSON.stringify({json.dumps(payload)})
                          }});
                          return await r.json();
                      }}
                  """)
                  
                  answer = ai_res.get('answer', "Yaar, site ne filter laga diya! 🤪")
                  chat_history.append({"role": "user", "content": user_query})
                  chat_history.append({"role": "assistant", "content": answer})
                  return jsonify({"answer": answer})
              except Exception as e:
                  print(f"Error: {e}")
                  await init_playwright() # Error aane par restart browser
                  return jsonify({"answer": "Network error, retry karo Badal bhai! 😂"})

          if __name__ == "__main__":
              # Start Playwright in the main event loop
              loop = asyncio.get_event_loop()
              loop.run_until_complete(init_playwright())
              app.run(port=5000, debug=False, use_reloader=False)
          EOF
          
          sleep 10
          bore local 5000 --to bore.pub
