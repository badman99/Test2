name: Fast AI Test (No Playwright)
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          pip install curl_cffi
          
      - name: Run Fast Script
        run: |
          python3 << 'EOF'
          import json
          import time
          from curl_cffi import requests

          # Working Proxies ki list
          PROXY_LIST = [
              "38.34.179.78:8445", "38.34.179.105:8449", "103.171.255.242:8086",
              "36.66.180.186:8080", "190.7.138.78:8080", "45.167.124.52:8080",
              "38.34.179.86:8452", "38.199.30.195:999", "137.220.150.22:6005",
              "45.136.131.62:8449"
          ]

          def run_ai_test(proxy):
              print(f"\n🚀 [LOG] Trying with Proxy (curl_cffi): {proxy}")
              
              # Impersonate Chrome 110 (Cloudflare bypass magic ✨)
              session = requests.Session(impersonate="chrome110")
              
              proxies = {
                  "http": f"http://{proxy}",
                  "https": f"http://{proxy}"
              }

              try:
                  # 1. Get Nonce
                  print(f"[LOG] Fetching Nonce from API...")
                  nonce_res = session.get(
                      "https://aifreeforever.com/api/chat-nonce",
                      proxies=proxies,
                      timeout=15
                  )
                  
                  print(f"📄 RAW NONCE RESPONSE: {nonce_res.status_code} - {nonce_res.text}")
                  
                  if nonce_res.status_code != 200:
                      raise Exception(f"Nonce failed with status {nonce_res.status_code}")
                  
                  nonce = nonce_res.json().get('nonce')

                  # 2. AI Answer Request
                  print(f"[LOG] Sending AI Request...")
                  payload = {
                      "question": "What is 2+2?",
                      "tone": "friendly",
                      "format": "paragraph",
                      "file": None,
                      "conversationHistory": [],
                      "interactionProof": {
                          "nonce": nonce,
                          "keystrokeCount": 15,
                          "pasteEvents": 0,
                          "totalTypingTime": 3500,
                          "startTime": int(time.time() * 1000) - 3500,
                          "submitTime": int(time.time() * 1000)
                      },
                      "aiRole": "assistant",
                      "aiName": ""
                  }

                  ai_res = session.post(
                      "https://aifreeforever.com/api/generate-ai-answer",
                      json=payload,
                      proxies=proxies,
                      timeout=20,
                      headers={"Content-Type": "application/json"}
                  )

                  print(f"📄 RAW AI RESPONSE: {ai_res.status_code} - {ai_res.text}")
                  
                  if ai_res.status_code == 200:
                      return True
                  return False

              except Exception as e:
                  print(f"❌ [ERROR] Proxy {proxy} failed: {str(e)}")
                  return False

          def main():
              for proxy in PROXY_LIST:
                  success = run_ai_test(proxy)
                  if success:
                      print("\n✅ [FINAL] Task completed successfully using curl_cffi!")
                      break
                  else:
                      print("⚠️ [RETRY] Moving to next proxy...")

          if __name__ == "__main__":
              main()
          EOF
