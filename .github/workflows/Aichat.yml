name: Fast AI Test (curl_cffi)
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install curl_cffi
        run: pip install curl_cffi
          
      - name: Run Fast Script with Confirmed Proxies
        run: |
          python3 << 'EOF'
          import json
          import time
          from curl_cffi import requests

          # Badal bhai ki confirmed working proxies! 😎
          CONFIRMED_PROXIES = [
              "38.34.179.78:8445", "38.34.179.105:8449", "103.171.255.242:8086",
              "36.66.180.186:8080", "190.7.138.78:8080", "45.167.124.52:8080",
              "38.34.179.86:8452", "38.199.30.195:999", "137.220.150.22:6005",
              "45.136.131.62:8449", "120.92.211.211:7890", "116.80.82.92:7777",
              "14.225.240.23:8562", "103.120.220.201:8083", "194.59.204.87:9080"
          ]

          def run_ai_test(proxy):
              print(f"\n" + "="*50)
              print(f"📡 [CONNECTING] Proxy: {proxy}")
              print("="*50)
              
              # Chrome 110 impersonation (Cloudflare bypass magic ✨)
              session = requests.Session(impersonate="chrome110")
              proxies = {"http": f"http://{proxy}", "https": f"http://{proxy}"}

              try:
                  # STEP 1: Fetch Nonce
                  print(f"⏳ [STEP 1] Fetching Nonce...")
                  start_time = time.time()
                  nonce_res = session.get(
                      "https://aifreeforever.com/api/chat-nonce",
                      proxies=proxies,
                      timeout=15
                  )
                  latency = round(time.time() - start_time, 2)
                  
                  print(f"📄 [NONCE STATUS]: {nonce_res.status_code} ({latency}s)")
                  print(f"📄 [NONCE RAW]: {nonce_res.text}")
                  
                  if nonce_res.status_code != 200:
                      raise Exception(f"Failed to get Nonce, status: {nonce_res.status_code}")
                  
                  nonce = nonce_res.json().get('nonce')
                  if not nonce:
                      raise Exception("Nonce is missing in JSON response!")

                  # STEP 2: Send AI Request
                  print(f"\n⏳ [STEP 2] Sending AI Request (2+2)...")
                  payload = {
                      "question": "What is 2+2?",
                      "tone": "friendly",
                      "format": "paragraph",
                      "file": None,
                      "conversationHistory": [],
                      "interactionProof": {
                          "nonce": nonce,
                          "keystrokeCount": 25,
                          "totalTypingTime": 4000,
                          "startTime": int(time.time() * 1000) - 4000,
                          "submitTime": int(time.time() * 1000)
                      },
                      "aiRole": "assistant"
                  }

                  ai_res = session.post(
                      "https://aifreeforever.com/api/generate-ai-answer",
                      json=payload,
                      proxies=proxies,
                      timeout=20,
                      headers={"Content-Type": "application/json"}
                  )

                  print(f"📄 [AI STATUS]: {ai_res.status_code}")
                  print(f"📄 [AI RAW BODY]:\n{json.dumps(ai_res.json(), indent=2, ensure_ascii=False)}")
                  
                  if ai_res.status_code == 200:
                      print(f"\n🎯 [SUCCESS] Proxy {proxy} worked perfectly!")
                      return True
                  else:
                      print(f"❌ [FAILED] Status Code {ai_res.status_code}")
                      return False

              except Exception as e:
                  print(f"❌ [ERROR] Something went wrong: {str(e)}")
                  return False

          def main():
              print(f"🔥 Badal bhai, testing shuru kar rahe hain with {len(CONFIRMED_PROXIES)} proxies...")
              for proxy in CONFIRMED_PROXIES:
                  if run_ai_test(proxy):
                      print("\n✅ [FINAL] Ek number kaam ho gaya! 🤪🔥")
                      break
                  else:
                      print("⚠️ [NEXT] Is proxy ne dhoka de diya, agali try karte hain...")

          if __name__ == "__main__":
              main()
          EOF
