name: Multi-Threaded Proxy Collector
on: workflow_dispatch

jobs:
  find-proxies:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Check Proxies
        run: |
          python3 << 'EOF'
          import requests
          from concurrent.futures import ThreadPoolExecutor
          import sys

          # Proxy sources jahan se free list milegi
          SOURCES = [
              "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all",
              "https://www.proxy-list.download/api/v1/get?type=https",
              "https://raw.githubusercontent.com/TheSpeedX/SOCKS-List/master/http.txt"
          ]

          TARGET_URL = "https://aifreeforever.com/api/chat-nonce" # Cloudflare test ke liye
          WORKING_PROXIES = []
          MAX_WORKING = 10
          THREADS = 50

          def check_proxy(proxy):
              if len(WORKING_PROXIES) >= MAX_WORKING:
                  return
              
              proxy = proxy.strip()
              if not proxy: return

              proxies = {
                  "http": f"http://{proxy}",
                  "https": f"http://{proxy}"
              }
              
              try:
                  # Yahan Cloudflare bypass check ho raha hai
                  r = requests.get(TARGET_URL, proxies=proxies, timeout=10)
                  if r.status_code == 200:
                      print(f"✅ [SUCCESS] {proxy} bypassed Cloudflare!")
                      WORKING_PROXIES.append(proxy)
              except Exception:
                  pass

          def main():
              print("🔥 Proxy source se data utha raha hoon...")
              raw_proxies = []
              for s in SOURCES:
                  try:
                      res = requests.get(s, timeout=10)
                      raw_proxies.extend(res.text.splitlines())
                  except:
                      continue
              
              all_proxies = list(set(raw_proxies))
              print(f"Total {len(all_proxies)} proxies mili. Ab 50 threads ke saath check shuru... 😂")

              with ThreadPoolExecutor(max_workers=THREADS) as executor:
                  executor.map(check_proxy, all_proxies)
                  
                  # Jab tak 10 na mil jaye ya list khatam na ho
                  while len(WORKING_PROXIES) < MAX_WORKING and any(executor._threads):
                      pass

              print("\n--- FINAL 10 CLOUDFLARE BYPASS PROXIES ---")
              for p in WORKING_PROXIES[:10]:
                  print(p)
              
              if not WORKING_PROXIES:
                  print("❌ Koyi working proxy nahi mili jo Cloudflare bypass kare. Free wali aisi hi hoti hain! 🤪")

          if __name__ == "__main__":
              main()
          EOF
