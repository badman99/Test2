# .github/workflows/ai-test.yml

name: AI Test
on: workflow_dispatch  # manually trigger karo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Run Script
        run: |
          python3 << 'EOF'
          from playwright.sync_api import sync_playwright
          
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              
              page.goto("https://aifreeforever.com/tools/free-chatgpt-no-login")
              
              # Nonce lo
              nonce = page.evaluate("""
                  async () => {
                      const r = await fetch('/api/chat-nonce');
                      return (await r.json()).nonce;
                  }
              """)
              print("Nonce:", nonce)
              
              # AI call karo
              result = page.evaluate(f"""
                  async () => {{
                      const r = await fetch('/api/generate-ai-answer', {{
                          method: 'POST',
                          headers: {{'Content-Type': 'application/json'}},
                          body: JSON.stringify({{
                              question: "What is 2+2?",
                              tone: "friendly",
                              format: "paragraph",
                              file: null,
                              conversationHistory: [],
                              interactionProof: {{
                                  nonce: '{nonce}',
                                  keystrokeCount: 5,
                                  pasteEvents: 0,
                                  totalTypingTime: 3000,
                                  startTime: Date.now() - 3000,
                                  submitTime: Date.now()
                              }},
                              aiRole: "assistant",
                              aiName: ""
                          }})
                      }});
                      return await r.json();
                  }}
              """)
              print("Answer:", result)
              browser.close()
          EOF
