name: AI Test with Proxy Rotation
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          
      - name: Run Script with Proxy Rotation
        run: |
          python3 << 'EOF'
          import json
          import requests
          from playwright.sync_api import sync_playwright

          # Working Proxies ki list (Tum yahan aur bhi add kar sakte ho)
          PROXY_LIST = [
              "38.34.179.78:8445", "38.34.179.105:8449", "103.171.255.242:8086",
              "36.66.180.186:8080", "190.7.138.78:8080", "45.167.124.52:8080",
              "38.34.179.86:8452", "38.199.30.195:999", "137.220.150.22:6005",
              "45.136.131.62:8449"
          ]

          def run_ai_test(proxy):
              print(f"\n🚀 [LOG] Trying with Proxy: {proxy}")
              try:
                  with sync_playwright() as p:
                      # Proxy setup in browser
                      browser = p.chromium.launch(proxy={"server": f"http://{proxy}"}, headless=True)
                      context = browser.new_context()
                      page = context.new_page()
                      
                      print(f"[LOG] Navigating to target site...")
                      page.goto("https://aifreeforever.com/tools/free-chatgpt-no-login", timeout=60000)
                      
                      # 1. Nonce Fetching (Raw Response)
                      print(f"[LOG] Fetching Nonce...")
                      nonce_data = page.evaluate("""
                          async () => {
                              const r = await fetch('/api/chat-nonce');
                              const data = await r.json();
                              return { status: r.status, body: data };
                          }
                      """)
                      print(f"📄 RAW NONCE RESPONSE: {json.dumps(nonce_data, indent=2)}")
                      
                      nonce = nonce_data['body'].get('nonce')
                      if not nonce:
                          raise Exception("Nonce not found in response!")

                      # 2. AI Answer Fetching (Raw Response)
                      print(f"[LOG] Sending AI Request...")
                      ai_data = page.evaluate(f"""
                          async () => {{
                              const r = await fetch('/api/generate-ai-answer', {{
                                  method: 'POST',
                                  headers: {{'Content-Type': 'application/json'}},
                                  body: JSON.stringify({{
                                      question: "What is 2+2?",
                                      tone: "friendly",
                                      format: "paragraph",
                                      file: null,
                                      conversationHistory: [],
                                      interactionProof: {{
                                          nonce: '{nonce}',
                                          keystrokeCount: 5,
                                          pasteEvents: 0,
                                          totalTypingTime: 3000,
                                          startTime: Date.now() - 3000,
                                          submitTime: Date.now()
                                      }},
                                      aiRole: "assistant",
                                      aiName: ""
                                  }})
                              }});
                              const data = await r.json();
                              return {{ status: r.status, body: data }};
                          }}
                      """)
                      print(f"📄 RAW AI RESPONSE: {json.dumps(ai_data, indent=2)}")
                      
                      browser.close()
                      return True # Success
              except Exception as e:
                  print(f"❌ [ERROR] Proxy {proxy} failed: {str(e)}")
                  return False

          def main():
              for proxy in PROXY_LIST:
                  success = run_ai_test(proxy)
                  if success:
                      print("\n✅ [FINAL] Task completed successfully!")
                      break
                  else:
                      print("⚠️ [RETRY] Moving to next proxy...")

          if __name__ == "__main__":
              main()
          EOF
