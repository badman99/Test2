name: 🧪 File Name & Size Tester v2

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Direct URL dalo (Google CDN, HubCDN, PixelDrain, kuch bhi)'
        required: true

jobs:
  test-filename:
    runs-on: ubuntu-latest

    steps:
      - name: 🐍 Python taiyaar karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 curl_cffi install karo
        run: pip install curl_cffi

      - name: 🔍 Naam aur Size nikalo (Bina Download Kiye!)
        run: |
          python - <<'EOF'
          from curl_cffi import requests
          from urllib.parse import urlparse, unquote
          import re

          url = "${{ github.event.inputs.target_url }}"
          print(f"🎯 Target URL: {url}\n")

          session = requests.Session(impersonate="chrome")

          # =============================================
          # LAYER 1: HEAD REQUEST
          # =============================================
          print("━"*50)
          print("🔵 [Layer 1] HEAD Request maar raha hoon...")
          filename = None
          size_str = None
          resumable = False
          content_type = "Unknown"

          try:
              resp_head = session.head(url, allow_redirects=True, timeout=20)
              print(f"   Status: {resp_head.status_code}")

              content_type = resp_head.headers.get("Content-Type", "Unknown")
              resumable = resp_head.headers.get("Accept-Ranges", "") == "bytes"

              # Size
              cl = resp_head.headers.get("Content-Length")
              if cl:
                  b = int(cl)
                  if b >= 1_073_741_824:
                      size_str = f"{b / 1_073_741_824:.2f} GB ({b:,} bytes)"
                  elif b >= 1_048_576:
                      size_str = f"{b / 1_048_576:.2f} MB ({b:,} bytes)"
                  else:
                      size_str = f"{b / 1024:.2f} KB ({b:,} bytes)"

              # Filename from Content-Disposition
              cd = resp_head.headers.get("Content-Disposition", "")
              if "filename" in cd:
                  match = re.search(r"filename\*?=['\"]?(?:UTF-8'')?([^'\";\n\r]+)", cd, re.IGNORECASE)
                  if match:
                      filename = unquote(match.group(1).strip().strip('"').strip("'"))
                      print(f"   ✅ Content-Disposition se mila: {filename}")

          except Exception as e:
              print(f"   ⚠️ HEAD fail hua: {e}")

          # =============================================
          # LAYER 2: GET STREAM (agar Layer 1 ne naam nahi diya)
          # =============================================
          if not filename:
              print("\n" + "━"*50)
              print("🟡 [Layer 2] GET stream=True maar raha hoon (0 bytes download)...")
              try:
                  resp_get = session.get(url, stream=True, allow_redirects=True, timeout=20)
                  print(f"   Status: {resp_get.status_code}")

                  content_type = resp_get.headers.get("Content-Type", content_type)
                  resumable = resp_get.headers.get("Accept-Ranges", "") == "bytes"

                  # Size (agar HEAD pe nahi mili)
                  if not size_str:
                      cl = resp_get.headers.get("Content-Length")
                      if cl:
                          b = int(cl)
                          if b >= 1_073_741_824:
                              size_str = f"{b / 1_073_741_824:.2f} GB ({b:,} bytes)"
                          elif b >= 1_048_576:
                              size_str = f"{b / 1_048_576:.2f} MB ({b:,} bytes)"
                          else:
                              size_str = f"{b / 1024:.2f} KB ({b:,} bytes)"

                  # Filename from Content-Disposition
                  cd = resp_get.headers.get("Content-Disposition", "")
                  if "filename" in cd:
                      match = re.search(r"filename\*?=['\"]?(?:UTF-8'')?([^'\";\n\r]+)", cd, re.IGNORECASE)
                      if match:
                          filename = unquote(match.group(1).strip().strip('"').strip("'"))
                          print(f"   ✅ GET Content-Disposition se mila: {filename}")

                  # IMPORTANT: Turant close — 1 byte bhi body nahi chahiye!
                  resp_get.close()

              except Exception as e:
                  print(f"   ⚠️ GET stream fail hua: {e}")

          # =============================================
          # LAYER 3: URL FALLBACK
          # =============================================
          if not filename:
              print("\n" + "━"*50)
              print("🔴 [Layer 3] URL se try kar raha hoon...")
              path = urlparse(url).path
              name = unquote(path.split("/")[-1])
              if "." in name and len(name) > 5:
                  filename = name
                  print(f"   ✅ URL path se mila: {filename}")
              else:
                  filename = "❌ Naam nahi mila (teen layers ke baad bhi!)"
                  print(f"   ❌ URL mein bhi naam nahi tha (MD5/token hai shayad)")

          # =============================================
          # FINAL REPORT
          # =============================================
          print("\n" + "█"*55)
          print("📊          FINAL REPORT")
          print("█"*55)
          print(f"📁 Filename  : {filename}")
          print(f"📦 Size      : {size_str or '❌ Nahi mili'}")
          print(f"🎬 Type      : {content_type}")
          print(f"⏸️  Resumable : {'✅ HAN' if resumable else '❌ NAHI'}")
          print("█"*55)
          EOF
